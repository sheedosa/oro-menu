# Pages CMS config — https://pagescms.org
# The café owner edits menu.json through a form at app.pagescms.org.
# Saving commits to GitHub; the live GitHub Pages site updates automatically.
#
# Organised like the website: a list of Menu Sections (by name), and inside each
# section a list of Items shown as "name — price". Technical settings are grouped
# at the bottom of each section under "Advanced".

media:
  input: img        # folder in the repo where photos live
  output: /img      # path written into menu.json (menu.js normalises this)

content:
  - name: menu
    label: Menu
    type: file
    path: menu.json
    fields:
      # ============ MENU SECTIONS (what the client edits) ============
      - name: sections
        label: Menu Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.en} · {fields.title.ar}"
        fields:
          - name: title
            label: "Section name"
            type: object
            fields:
              - { name: en, label: "English name", type: string, required: false }
              - { name: ar, label: "Arabic name", type: string, required: false }

          # ---- Items in this section ----
          - name: items
            label: Items
            description: "Each row is a menu item. Edit its name and price, or use + / – to add and remove."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.en} — {fields.price}{fields.priceSmall}"
            fields:
              - { name: ar, label: "Arabic name", type: string }
              - { name: en, label: "English name", type: string }
              - { name: price, label: "Price (e.g. 5, 3.5, or +3)", type: string, required: false }
              - { name: note, label: "Note / description (optional)", type: text, required: false }
              - { name: featured, label: "Featured (gold highlight)", type: boolean, default: false }
              # --- the following are only for special items; leave as-is for normal ones ---
              - { name: twoPrice, label: "Two prices? small/large — juices only (advanced)", type: boolean, default: false }
              - { name: priceSmall, label: "Price — small (advanced)", type: string, required: false }
              - { name: priceLarge, label: "Price — large (advanced)", type: string, required: false }
              - { name: subcatAr, label: "Start a subcategory here — Arabic (advanced)", type: string, required: false }
              - { name: subcatEn, label: "Start a subcategory here — English (advanced)", type: string, required: false }

          # ---- Section appearance & settings (advanced; rarely changed) ----
          - name: media
            label: "Photo / Video — advanced"
            type: object
            fields:
              - name: type
                label: "Media type"
                type: select
                options: { values: [image, video] }
                default: image
              - { name: image, label: "Upload a new photo", type: image, required: false }
              - { name: base, label: "Existing image filename (without extension)", type: string, required: false }
              - { name: poster, label: "Video poster filename (video only)", type: string, required: false }
              - { name: alt, label: "Alt text (accessibility)", type: string, required: false }
              - { name: caption, label: "Caption under photo", type: string, required: false }
              - { name: width, label: "Width", type: number, required: false }
              - { name: height, label: "Height", type: number, required: false }
          - name: sizeRow
            label: "Size columns — juices only, leave blank otherwise (advanced)"
            type: object
            required: false
            fields:
              - { name: smallAr, label: "Small (Arabic)", type: string, required: false }
              - { name: smallEn, label: "Small (English)", type: string, required: false }
              - { name: largeAr, label: "Large (Arabic)", type: string, required: false }
              - { name: largeEn, label: "Large (English)", type: string, required: false }
          - { name: id, label: "Section ID — URL-safe, unique (advanced)", type: string }
          - name: theme
            label: "Background theme (advanced)"
            type: select
            options: { values: [dark, light] }
            default: dark
          - { name: flip, label: "Flip layout (advanced)", type: boolean, default: false }
          - { name: showHead, label: "Show section header (advanced)", type: boolean, default: true }

      # ============ TOP NAVIGATION (advanced) ============
      - name: nav
        label: Top Navigation (advanced)
        description: "The pills in the sticky bar. Only change when adding or removing a whole section. (Tea is intentionally left out.)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.en}"
        fields:
          - { name: href, label: "Section ID (e.g. hot-drinks)", type: string }
          - { name: ar, label: "Arabic label", type: string }
          - { name: en, label: "English label", type: string }
